services:
  coveritup:
    build: .
    ports:
      - "3003:3003"
    environment:
      - DATABASE_DSN=root:password@tcp(db:3306)/
      - DATABASE_NAME=coveritup
      - HOST=0.0.0.0
      - BASE_URL=http://localhost:3003/
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: coveritup
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      timeout: 20s
      retries: 10

volumes:
  db_data:
